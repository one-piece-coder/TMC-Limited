<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi Liam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Bangers&family=Pacifico&family=Lobster&family=Press+Start+2P&family=Permanent+Marker&family=Bungee&family=Comic+Neue:wght@700&family=Creepster&family=Righteous&display=swap">
<style>
  /* Layout: one centered button, the greeting appears below it */
  :root {
    --bg: #eef3ff;
    --fg: #1b2340;
    --font: "Fredoka", ui-rounded, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #11162a; --fg: #eef1ff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #11162a; --fg: #eef1ff; color-scheme: dark; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    transition: background 0.3s, color 0.3s;
  }
  button {
    font-family: var(--font);
    font-size: 1.6rem;
    padding: 0.8rem 2.4rem;
    border: none;
    border-radius: 999px;
    /* The button uses the page colors flipped, so it always stands out */
    background: var(--fg);
    color: var(--bg);
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }
  #message {
    font-size: clamp(2.5rem, 12vw, 4.5rem);
    margin: 0;
    min-height: 1.4em;
    text-align: center;
  }
  #note { font-family: system-ui, sans-serif; font-size: 0.9rem; opacity: 0.75; margin: 0; }

  /* The small "Pick voices" menu for grown-ups */
  .voices {
    font-family: system-ui, sans-serif;
    font-size: 0.95rem;
    width: 100%;
    max-width: 26rem;
    margin-top: 1rem;
  }
  .voices summary { cursor: pointer; text-align: center; opacity: 0.8; padding: 0.4rem; }
  .voice-row {
    display: grid;
    grid-template-columns: 7.5rem minmax(0, 1fr) auto;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.6rem;
  }
  .extra { margin-top: 1.2rem; border-top: 1px solid currentColor; padding-top: 0.8rem; }
  .extra-title { font-weight: 700; margin: 0; text-align: center; }
  .extra-hint, .extra-count { margin: 0.4rem 0 0; font-size: 0.85rem; opacity: 0.85; text-align: center; }
  .extra-list {
    list-style: none;
    margin: 0.6rem 0 0;
    padding: 0;
    max-height: 18rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .extra-list li { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .extra-list label { display: flex; align-items: center; gap: 0.5rem; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
  .voice-toggle { display: flex; gap: 0.5rem; align-items: center; justify-content: center; margin-top: 0.8rem; cursor: pointer; }
  .voice-row select { font: inherit; padding: 0.35rem; min-width: 0; width: 100%; }
  .voices button.test {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.35rem 0.9rem;
  }

  /* The greeting sits between two waving hands */
  .greeting {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(0.5rem, 3vw, 1.5rem);
    max-width: 100%;
  }
  .greeting #message { min-width: 0; padding-inline: 0.2em; } /* room for slanted fonts */
  .hand {
    font-size: clamp(2.5rem, 12vw, 5rem);
    line-height: 1;
    display: inline-block;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    transform-origin: 70% 90%; /* wave from the wrist */
    visibility: hidden; /* hands show up on the first push */
  }
  .hand.left { transform: scaleX(-1); } /* mirror so both hands face Liam */
  .hand.show { visibility: visible; }
  .hand.right.waving { animation: wave-right 1.4s ease-in-out; }
  .hand.left.waving { animation: wave-left 1.4s ease-in-out; }
  @keyframes wave-right {
    0%, 100% { transform: rotate(0deg); }
    15%, 45%, 75% { transform: rotate(18deg); }
    30%, 60%, 90% { transform: rotate(-12deg); }
  }
  @keyframes wave-left {
    0%, 100% { transform: scaleX(-1) rotate(0deg); }
    15%, 45%, 75% { transform: scaleX(-1) rotate(18deg); }
    30%, 60%, 90% { transform: scaleX(-1) rotate(-12deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    body, button { transition: none; }
    .hand.waving { animation-duration: 0.01s; }
  }
</style>
</head>
<body>

<button id="greet-button" type="button">Push me</button>
<div class="greeting">
  <span class="hand left" aria-hidden="true">👋</span>
  <p id="message" aria-live="polite"></p>
  <span class="hand right" aria-hidden="true">👋</span>
</div>
<p id="note" hidden>Your browser can't speak, but here's the greeting anyway.</p>

<details class="voices">
  <summary>Pick voices</summary>
  <div class="voice-row">
    <label for="man-voice">Man's voice</label>
    <select id="man-voice"><option value="">Automatic</option></select>
    <button type="button" class="test" id="test-man">Test</button>
  </div>
  <div class="voice-row">
    <label for="lady-voice">Lady's voice</label>
    <select id="lady-voice"><option value="">Automatic</option></select>
    <button type="button" class="test" id="test-lady">Test</button>
  </div>
  <div class="voice-row">
    <label for="cartoon-voice">Cartoon voice</label>
    <select id="cartoon-voice"><option value="">Automatic</option></select>
    <button type="button" class="test" id="test-cartoon">Test</button>
  </div>
  <div class="voice-row">
    <label for="kid-voice">Bouncy kid voice</label>
    <select id="kid-voice"><option value="">Automatic</option></select>
    <button type="button" class="test" id="test-kid">Test</button>
  </div>
  <label class="voice-toggle"><input type="checkbox" id="use-cartoon" checked> Take turns with the fun voices too</label>

  <div class="extra">
    <p class="extra-title">More voices on this phone</p>
    <p class="extra-hint">Tick any voice to add it to the turns. Voices you download show up here. If a new one is missing, close and reopen this page.</p>
    <label class="voice-toggle"><input type="checkbox" id="show-all-langs"> Show other languages too</label>
    <p class="extra-count" id="extra-count"></p>
    <ul class="extra-list" id="extra-list"></ul>
  </div>
</details>

<script>
  const button = document.getElementById("greet-button");
  const message = document.getElementById("message");
  const note = document.getElementById("note");
  const root = document.documentElement;

  // Background and text color pairs that are easy to read together.
  const colors = [
    { bg: "#ffde59", fg: "#1a1a1a" },
    { bg: "#1e3a8a", fg: "#ffffff" },
    { bg: "#ff6b6b", fg: "#ffffff" },
    { bg: "#0f766e", fg: "#fef3c7" },
    { bg: "#f472b6", fg: "#1e1b4b" },
    { bg: "#111827", fg: "#34d399" },
    { bg: "#a3e635", fg: "#1f2937" },
    { bg: "#7c3aed", fg: "#fde68a" },
    { bg: "#fb923c", fg: "#1c1917" },
    { bg: "#e0f2fe", fg: "#b91c1c" },
  ];

  const fonts = [
    '"Fredoka", sans-serif',
    '"Bangers", cursive',
    '"Pacifico", cursive',
    '"Lobster", cursive',
    '"Press Start 2P", monospace',
    '"Permanent Marker", cursive',
    '"Bungee", sans-serif',
    '"Comic Neue", sans-serif',
    '"Creepster", cursive',
    '"Righteous", sans-serif',
  ];

  let lastColor = -1;
  let lastFont = 0;

  // Pick a random number from 0 to length-1, but never the same as last time.
  function pickNew(length, last) {
    let next;
    do { next = Math.floor(Math.random() * length); } while (next === last);
    return next;
  }

  // ---- The happy tune (an original melody, made with the browser's sound maker) ----
  let audio = null;
  let tuneNodes = [];

  // Note name -> frequency in Hz
  const NOTES = {
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0,
    B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99,
    A5: 880.0, C6: 1046.5,
  };

  // Each step is [note, length in beats]. "-" means a short rest.
  // Part A: the happy hello
  const PART_A = [
    ["C5", 0.5], ["G4", 0.5], ["E4", 0.5], ["G4", 0.5],
    ["A4", 0.5], ["G4", 0.5], ["E4", 1],
    ["F4", 0.5], ["A4", 0.5], ["C5", 0.5], ["D5", 0.5],
    ["E5", 0.75], ["-", 0.25], ["D5", 0.5], ["C5", 0.5],
    ["G4", 0.5], ["E5", 0.5], ["G5", 1.5], ["-", 0.5],
  ];
  // Part B: the bouncy middle
  const PART_B = [
    ["E5", 0.5], ["E5", 0.5], ["F5", 0.5], ["G5", 0.5],
    ["A5", 0.5], ["G5", 0.5], ["E5", 1],
    ["D5", 0.5], ["D5", 0.5], ["E5", 0.5], ["F5", 0.5],
    ["G5", 1], ["E5", 1],
    ["C5", 0.5], ["D5", 0.5], ["E5", 0.5], ["C5", 0.5],
    ["A4", 0.5], ["B4", 0.5], ["C5", 0.5], ["D5", 0.5],
    ["G4", 0.5], ["A4", 0.5], ["B4", 0.5], ["D5", 0.5],
    ["G5", 1.5], ["-", 0.5],
  ];
  // Ending: a big finish
  const ENDING = [
    ["C5", 0.5], ["E5", 0.5], ["G5", 0.5], ["E5", 0.5],
    ["F5", 0.5], ["D5", 0.5], ["B4", 0.5], ["D5", 0.5],
    ["C5", 0.25], ["-", 0.25], ["C5", 0.25], ["-", 0.25],
    ["G5", 0.5], ["C6", 2],
  ];
  // The whole song: A, B, A again, then the ending (about 10 seconds)
  const TUNE = [].concat(PART_A, PART_B, PART_A, ENDING);
  const BEAT = 0.22; // seconds per beat

  function stopTune() {
    tuneNodes.forEach(function (osc) { try { osc.stop(); } catch (e) {} });
    tuneNodes = [];
  }

  function playTune() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      audio.resume();
    } catch (e) {
      return; // no sound support, skip the tune
    }
    stopTune();
    let time = audio.currentTime + 0.05;
    TUNE.forEach(function (step) {
      const length = step[1] * BEAT;
      if (step[0] !== "-") {
        const osc = audio.createOscillator();
        const volume = audio.createGain();
        osc.type = "triangle";
        osc.frequency.value = NOTES[step[0]];
        // Quick fade in and out so each note sounds like a little "boop"
        volume.gain.setValueAtTime(0, time);
        volume.gain.linearRampToValueAtTime(0.25, time + 0.02);
        volume.gain.exponentialRampToValueAtTime(0.001, time + length * 0.95);
        osc.connect(volume).connect(audio.destination);
        osc.start(time);
        osc.stop(time + length);
        tuneNodes.push(osc);
      }
      time += length;
    });
  }

  // ---- Pick a voice, switching man / lady each time ----
  // Browsers don't say whether a voice is a man or a lady, so we match on
  // the names of common voices on iPhone, Mac, Windows, Android and Chrome.
  const LADY_NAMES = /samantha|ava|allison|susan|zoe|karen|moira|tessa|fiona|victoria|serena|kate|nicky|siri.*(female|voice [24])|aria|jenny|zira|hazel|libby|sonia|michelle|emma|ana|natasha|female|google us english/i;
  const MAN_NAMES = /alex|daniel|fred|tom|aaron|arthur|oliver|rishi|gordon|lee|evan|nathan|reed|siri.*(male|voice [13])|david|guy|mark|george|ryan|christopher|eric|andrew|brian|davis|william|male/i;
  // Higher-quality voices usually have one of these words in their name
  const GOOD_WORDS = /natural|neural|online|premium|enhanced|siri|google/i;

  const manSelect = document.getElementById("man-voice");
  const ladySelect = document.getElementById("lady-voice");
  const cartoonSelect = document.getElementById("cartoon-voice");
  const kidSelect = document.getElementById("kid-voice");
  const useCartoon = document.getElementById("use-cartoon");
  let voices = [];
  let turn = 0; // which voice is next: man, lady, cartoon, then bouncy kid

  // Remember the voices you picked (only on this device)
  function savedVoice(key) {
    try { return localStorage.getItem(key) || ""; } catch (e) { return ""; }
  }
  function saveVoice(key, name) {
    try { localStorage.setItem(key, name); } catch (e) {}
  }

  function fillMenu(select, key) {
    const keep = select.value || savedVoice(key);
    select.innerHTML = "";
    const auto = document.createElement("option");
    auto.value = "";
    auto.textContent = "Automatic";
    select.appendChild(auto);
    voices.forEach(function (v) {
      const option = document.createElement("option");
      option.value = v.name;
      option.textContent = v.name + " (" + v.lang + ")";
      select.appendChild(option);
    });
    select.value = voices.some(function (v) { return v.name === keep; }) ? keep : "";
  }

  function loadVoices() {
    try {
      const all = window.speechSynthesis.getVoices();
      const english = all.filter(function (v) { return /^en/i.test(v.lang); });
      voices = english.length ? english : all;
      allVoices = all;
    } catch (e) { voices = []; allVoices = []; }
    fillMenu(manSelect, "hiLiam.manVoice");
    fillMenu(ladySelect, "hiLiam.ladyVoice");
    fillMenu(cartoonSelect, "hiLiam.cartoonVoice");
    fillMenu(kidSelect, "hiLiam.kidVoice");
    fillExtraList();
  }

  // ---- Extra voices: every voice on this device, tick to add to the turns ----
  const extraList = document.getElementById("extra-list");
  const extraCount = document.getElementById("extra-count");
  const showAllLangs = document.getElementById("show-all-langs");
  let allVoices = [];
  let extraNames = [];
  try { extraNames = JSON.parse(localStorage.getItem("hiLiam.extraVoices") || "[]"); } catch (e) {}

  function saveExtras() {
    try { localStorage.setItem("hiLiam.extraVoices", JSON.stringify(extraNames)); } catch (e) {}
  }

  // Ticked voices that are really on this device right now
  function extraVoices() {
    return extraNames.map(function (name) {
      return allVoices.find(function (v) { return v.name === name; });
    }).filter(Boolean);
  }

  function updateCount() {
    const n = extraVoices().length;
    extraCount.textContent = n === 0 ? "No extra voices ticked yet."
      : n === 1 ? "1 extra voice is taking turns." : n + " extra voices are taking turns.";
  }

  function fillExtraList() {
    if (!extraList) return;
    const list = showAllLangs.checked ? allVoices : voices;
    extraList.innerHTML = "";
    list.forEach(function (v, i) {
      const item = document.createElement("li");
      const label = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.id = "extra-voice-" + i;
      box.checked = extraNames.indexOf(v.name) !== -1;
      box.addEventListener("change", function () {
        extraNames = extraNames.filter(function (n) { return n !== v.name; });
        if (box.checked) extraNames.push(v.name);
        saveExtras();
        updateCount();
      });
      label.appendChild(box);
      label.appendChild(document.createTextNode(v.name + " (" + v.lang + ")"));
      const test = document.createElement("button");
      test.type = "button";
      test.className = "test";
      test.textContent = "Test";
      test.addEventListener("click", function () { speak({ voice: v }); });
      item.appendChild(label);
      item.appendChild(test);
      extraList.appendChild(item);
    });
    if (!list.length) {
      const item = document.createElement("li");
      item.textContent = "No voices found yet. Push the big button once, then reopen this menu.";
      extraList.appendChild(item);
    }
    updateCount();
  }
  if ("speechSynthesis" in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function score(v) {
    let s = 0;
    if (GOOD_WORDS.test(v.name)) s += 10;
    if (/en[-_]US/i.test(v.lang)) s += 2;
    if (v.localService) s += 1; // works without internet
    if (/compact|novelty|whisper|bad news|bells|zarvox|trinoids|albert|jester|organ|bubbles|cellos/i.test(v.name)) s -= 50;
    return s;
  }

  function autoVoice(wantMan) {
    const pattern = wantMan ? MAN_NAMES : LADY_NAMES;
    const matches = voices.filter(function (v) {
      // "female" contains "male", so a man's voice can't say "female"
      return pattern.test(v.name) && !(wantMan && /female/i.test(v.name));
    });
    matches.sort(function (a, b) { return score(b) - score(a); });
    return matches[0] || null;
  }

  // Use the voice picked in the menu, or choose one automatically.
  // kind is "man", "lady", "cartoon", "kid", or { voice: v } for an extra voice.
  function voiceFor(kind) {
    if (typeof kind === "object") return kind.voice;
    const selects = { man: manSelect, lady: ladySelect, cartoon: cartoonSelect, kid: kidSelect };
    const select = selects[kind];
    const found = voices.find(function (v) { return v.name === select.value; });
    // The cartoon voice starts from a lady's voice, which squeaks up best
    return found || autoVoice(kind === "man") || voices[0] || null;
  }

  function speak(kind, whenDone) {
    window.speechSynthesis.cancel(); // stop the last one if you push fast
    if (!voices.length) loadVoices();
    const voice = voiceFor(kind);
    let words;
    if (kind === "cartoon") {
      // Our own squeaky cartoon voice: as high as it goes, quick and bouncy,
      // with a stretched-out "Hiii" and an excited "Liam!"
      words = new SpeechSynthesisUtterance("Hiii, Liam!");
      words.pitch = 2;   // the highest pitch browsers allow
      words.rate = 1.15; // a little quick, like an excited cartoon
    } else if (kind === "kid") {
      // Our own bouncy kid voice: high, fast and super excited
      words = new SpeechSynthesisUtterance("Hi hi, Liam!");
      words.pitch = 1.6;
      words.rate = 1.3;
    } else {
      words = new SpeechSynthesisUtterance("Hi, Liam!");
      words.rate = 0.95; // a touch slower sounds more natural
      // Real voices sound best unchanged. With no man/lady voice, fake it.
      words.pitch = voice && voice.name ? 1 : (kind === "man" ? 0.7 : 1.4);
    }
    if (voice) {
      words.voice = voice;
      words.lang = voice.lang;
    }
    if (whenDone) {
      words.onend = whenDone;
      words.onerror = whenDone;
    }
    window.speechSynthesis.speak(words);
  }

  showAllLangs.addEventListener("change", fillExtraList);
  manSelect.addEventListener("change", function () { saveVoice("hiLiam.manVoice", manSelect.value); });
  ladySelect.addEventListener("change", function () { saveVoice("hiLiam.ladyVoice", ladySelect.value); });
  cartoonSelect.addEventListener("change", function () { saveVoice("hiLiam.cartoonVoice", cartoonSelect.value); });
  kidSelect.addEventListener("change", function () { saveVoice("hiLiam.kidVoice", kidSelect.value); });
  try { useCartoon.checked = localStorage.getItem("hiLiam.useCartoon") !== "no"; } catch (e) {}
  useCartoon.addEventListener("change", function () {
    try { localStorage.setItem("hiLiam.useCartoon", useCartoon.checked ? "yes" : "no"); } catch (e) {}
  });
  document.getElementById("test-man").addEventListener("click", function () {
    if ("speechSynthesis" in window) speak("man");
  });
  document.getElementById("test-lady").addEventListener("click", function () {
    if ("speechSynthesis" in window) speak("lady");
  });
  document.getElementById("test-cartoon").addEventListener("click", function () {
    if ("speechSynthesis" in window) speak("cartoon");
  });
  document.getElementById("test-kid").addEventListener("click", function () {
    if ("speechSynthesis" in window) speak("kid");
  });

  // ---- Say "Hi Liam!", then play the tune when the voice is done ----
  function sayHi() {
    stopTune();
    if (!("speechSynthesis" in window)) {
      note.hidden = false;
      playTune();
      return;
    }
    try {
      // Take turns: man, lady, cartoon, kid (or just man and lady if fun voices are off)
      const order = useCartoon.checked ? ["man", "lady", "cartoon", "kid"] : ["man", "lady"];
      // Then every extra voice you ticked
      extraVoices().forEach(function (v) { order.push({ voice: v }); });
      const kind = order[turn % order.length];
      turn++;
      let played = false;
      function thenTune() {
        if (played) return;
        played = true;
        playTune();
      }
      setTimeout(thenTune, 2500); // backup in case the voice never says it's done
      speak(kind, thenTune);
    } catch (e) {
      note.hidden = false;
      playTune();
    }
  }

  button.addEventListener("click", function () {
    // Wake up the sound maker during the tap (phones require this)
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      audio.resume();
    } catch (e) {}

    message.textContent = "Hi Liam!";

    // Wave both hands (remove the wave and add it back so it replays every push)
    document.querySelectorAll(".hand").forEach(function (hand) {
      hand.classList.add("show");
      hand.classList.remove("waving");
      void hand.offsetWidth; // makes the browser notice the wave was removed
      hand.classList.add("waving");
    });

    lastColor = pickNew(colors.length, lastColor);
    root.style.setProperty("--bg", colors[lastColor].bg);
    root.style.setProperty("--fg", colors[lastColor].fg);

    lastFont = pickNew(fonts.length, lastFont);
    root.style.setProperty("--font", fonts[lastFont]);

    sayHi();
  });
</script>
</body>
</html>
